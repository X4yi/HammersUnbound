buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath(group: 'com.anatawa12.forge', name: 'ForgeGradle', version: '2.3-1.0.+') {
            changing = true
        }
    }
}
repositories {
    flatDir {
        dirs '../X4UI/build/libs'
    }
    mavenLocal()
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
version = "1.0b6"
group = "com.x4yi.hammersunbound"
archivesBaseName = "hammersunbound"
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.12.2-14.23.5.2864'
    runDir  = 'run'
    mappings = 'snapshot_20171003'
}
dependencies {
    provided "mezz.jei:jei_1.12.2:4.16.1.302:api"
    runtime "mezz.jei:jei_1.12.2:4.16.1.302"
    deobfCompile "com.x4yi.x4ui:x4ui:r1.0b1"
}
tasks.withType(JavaExec) {
    if (name == 'runClient') {
        def wayland = System.getenv('WAYLAND_DISPLAY')
        def x11     = System.getenv('DISPLAY')
        if (wayland) {
            environment 'WAYLAND_DISPLAY', wayland
            if (x11) {
                environment 'DISPLAY', x11
            } else {
                environment 'DISPLAY', ':0'
            }
        } else if (x11) {
            environment 'DISPLAY', x11
        } else {
            environment 'DISPLAY', ':0'
        }
        environment '_JAVA_AWT_WM_NONREPARENTING', '1'
        jvmArgs '-Xmx768M'
        jvmArgs '-Dorg.lwjgl.opengl.Display.allowSoftwareOpenGL=true'
        jvmArgs '-Djava.awt.headless=false'
    }
}
jar {
    manifest {
        attributes([
            "Specification-Title"     : "hammersunbound",
            "Specification-Vendor"    : "x4yi",
            "Specification-Version"   : "${version}",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "x4yi",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}